<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page 2</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  html, body {
    height: 100%;
  }

  body {
    background: #12051a;
    background-image: url("page2_bg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
  }

  .form-card {
    width: 100%;
    max-width: 520px;
    border: 2px solid #ff2e88;
    border-radius: 14px;
    padding: 32px 24px;
    background: rgba(18, 5, 26, 0.88);
  }

  .form-item {
    margin-bottom: 22px;
  }

  .form-item label {
    display: block;
    color: #ffffff;
    font-size: 15px;
    margin-bottom: 8px;
  }

  .form-item input,
  .form-item select {
    width: 100%;
    height: 48px;
    background: #24142c;
    border: 1px solid #482054;
    border-radius: 8px;
    color: #ffffff;
    font-size: 15px;
    padding: 0 14px;
    outline: none;
    text-align: left;
  }

  .form-item input::placeholder {
    color: #9988aa;
  }

  .form-item select {
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='%23ff2e88' viewBox='0 0 16 16'><path d='M8 11l4-4H4l4 4z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 40px;
  }

  .register-btn {
    width: 100%;
    height: 56px;
    background: #ff2e88;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 6px;
  }

  .register-btn:active {
    opacity: 0.85;
  }

  .bottom-note {
    text-align: center;
    margin-top: 18px;
    color: #dddddd;
    font-size: 14px;
  }

  .bottom-note a {
    color: #ff2e88;
    text-decoration: underline;
  }
</style>
</head>

<body>
  <div class="form-card">

    <div class="form-item">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" />
    </div>

    <div class="form-item">
      <label>Email</label>
      <input type="email" placeholder="Enter your email" />
    </div>

    <div class="form-item">
      <label>Phone Number</label>
      <input type="tel" placeholder="Enter your phone number" />
    </div>

    <div class="form-item">
      <label>Preferred Area</label>
      <select id="state" name="state" required>
        <option value="">Select your state</option>
        <option value="AL">Alabama</option>
        <option value="AK">Alaska</option>
        <option value="AZ">Arizona</option>
        <option value="AR">Arkansas</option>
        <option value="CA">California</option>
        <option value="CO">Colorado</option>
        <option value="CT">Connecticut</option>
        <option value="DE">Delaware</option>
        <option value="FL">Florida</option>
        <option value="GA">Georgia</option>
        <option value="HI">Hawaii</option>
        <option value="ID">Idaho</option>
        <option value="IL">Illinois</option>
        <option value="IN">Indiana</option>
        <option value="IA">Iowa</option>
        <option value="KS">Kansas</option>
        <option value="KY">Kentucky</option>
        <option value="LA">Louisiana</option>
        <option value="ME">Maine</option>
        <option value="MD">Maryland</option>
        <option value="MA">Massachusetts</option>
        <option value="MI">Michigan</option>
        <option value="MN">Minnesota</option>
        <option value="MS">Mississippi</option>
        <option value="MO">Missouri</option>
        <option value="MT">Montana</option>
        <option value="NE">Nebraska</option>
        <option value="NV">Nevada</option>
        <option value="NH">New Hampshire</option>
        <option value="NJ">New Jersey</option>
        <option value="NM">New Mexico</option>
<option value="NY">New York</option>
        <option value="NC">North Carolina</option>
        <option value="ND">North Dakota</option>
        <option value="OH">Ohio</option>
        <option value="OK">Oklahoma</option>
        <option value="OR">Oregon</option>
        <option value="PA">Pennsylvania</option>
        <option value="RI">Rhode Island</option>
        <option value="SC">South Carolina</option>
        <option value="SD">South Dakota</option>
        <option value="TN">Tennessee</option>
        <option value="TX">Texas</option>
        <option value="UT">Utah</option>
        <option value="VT">Vermont</option>
        <option value="VA">Virginia</option>
        <option value="WA">Washington</option>
        <option value="WV">West Virginia</option>
        <option value="WI">Wisconsin</option>
        <option value="WY">Wyoming</option>
      </select>
    </div>

    <div class="form-item">
      <label>Password</label>
      <input type="password" placeholder="Enter your password" />
    </div>

    <div class="form-item">
      <label>Confirm Password</label>
      <input type="password" placeholder="Confirm your password" />
    </div>

    <button class="register-btn" onclick="location.href='page3.html'">
      REGISTER NOW
    </button>

    <div class="bottom-note">
      Already have an account? <a href="#">Login Here</a>
    </div>

  </div>
</body>
</html>
